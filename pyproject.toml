[project]
name = "dukaflow"
version = "0.1.0"
requires-python = ">=3.12"

# ---------- Tests ----------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["."]
omit = ["venv/*", "tests/*", "alembic/*", "scripts/*"]
concurrency = ["greenlet", "thread"]  # SQLAlchemy async runs code inside greenlets

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

# ---------- Lint / style ----------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (unused imports, undefined names)
    "I",        # import sorting
    "B",        # bugbear (likely bugs)
    "UP",       # modern Python syntax
    "SIM",      # simplifications
    "ASYNC",    # async pitfalls
    "S",        # bandit security checks
    "N",        # PEP 8 naming
    "RUF",      # ruff-specific
]
ignore = ["B008"]  # FastAPI's Query(...)/Depends(...) defaults are intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]  # asserts and dummy secrets are fine in tests

[tool.ruff.lint.isort]
known-first-party = ["core", "models", "routers", "schemas", "services", "main"]

# ---------- Type checking ----------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["venv/", "alembic/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
